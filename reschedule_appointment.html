<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reschedule Appointment</title>
    <script src="https://live.zwidgets.com/js-sdk/1.1/ZohoEmbededAppSDK.min.js"></script>
    <link rel="stylesheet" href="reschedule_appointment.css">
</head>
<body>
    <!-- Reschedule Button -->
    <div class="reschedule-container">
        <button id="rescheduleBtn" class="reschedule-button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            Reschedule Appointment
        </button>
    </div>

    <!-- Popup Modal -->
    <div id="rescheduleModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h2>Reschedule Appointment</h2>
                <button id="closeModal" class="close-button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            
            <div class="modal-body">
                <form id="rescheduleForm">
                    <!-- Reschedule From Field (Read-only) -->
                    <div class="form-group">
                        <label for="rescheduleFrom" class="form-label">
                            Reschedule From <span class="required">*</span>
                        </label>
                        <input 
                            type="text" 
                            id="rescheduleFrom" 
                            name="rescheduleFrom" 
                            class="form-input readonly" 
                            readonly
                            placeholder="Current appointment date & time"
                        />
                    </div>

                    <!-- New Appointment Start Date Time -->
                    <div class="form-group">
                        <label for="newAppointmentDateTime" class="form-label">
                            New Appointment Start Date & Time <span class="required">*</span>
                        </label>
                        <input 
                            type="datetime-local" 
                            id="newAppointmentDateTime" 
                            name="newAppointmentDateTime" 
                            class="form-input" 
                            required
                        />
                    </div>

                    <!-- Reschedule Reason -->
                    <div class="form-group">
                        <label for="rescheduleReason" class="form-label">
                            Reschedule Reason <span class="required">*</span>
                        </label>
                        <select id="rescheduleReason" name="rescheduleReason" class="form-select" required>
                            <option value="">Select Reason</option>
                            <option value="By Patient">By Patient</option>
                            <option value="By Doctor">By Doctor</option>
                            <option value="By Team">By Team</option>
                        </select>
                    </div>

                    <!-- Reschedule Note -->
                    <div class="form-group">
                        <label for="rescheduleNote" class="form-label">
                            Reschedule Note
                        </label>
                        <textarea 
                            id="rescheduleNote" 
                            name="rescheduleNote" 
                            class="form-textarea" 
                            rows="4"
                            placeholder="Enter additional notes for rescheduling..."
                        ></textarea>
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button type="button" id="cancelBtn" class="btn btn-cancel">Cancel</button>
                <button type="submit" id="confirmReschedule" class="btn btn-primary">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20,6 9,17 4,12"></polyline>
                    </svg>
                    Reschedule Appointment
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Rescheduling appointment...</p>
        </div>
    </div>

    <!-- Success/Error Messages -->
    <div id="messageContainer" class="message-container"></div>

    <script src="reschedule_appointment.js"></script>
</body>
</html>
